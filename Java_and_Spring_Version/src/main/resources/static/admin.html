<!DOCTYPE html>
<html lang='en'>
<head>
    <title>Admin Dashboard</title>
    <meta charset='UTF-8'>
    <link rel='stylesheet' href='common.css' />
    <link rel='stylesheet' href='admin.css' />
    <script src='admin.js' defer></script>
</head>
<body>
    <div id="top-left-content-div">
        <form action="/logout" method="post">
            <input type="submit" value="Log out" />
        </form>
        <a href="/" class="small-text">Home</a>
    </div>
    
    <h1>Admin Dashboard</h1>
    
    <div id='interactionContentDiv'>
        <div id='updateStatesDiv'>
            <h2>Update States Data</h2>
            <input type='file' id='statesFileInput' accept='.txt,.csv' />
            <button id='statesSubmitBtn'>Submit</button>
            <p id='statesSubmitStatusP'></p>
        </div>
        
        
        <div id='getStatesFromDatabaseDiv'>
            <button class='getStatesBtn'>Get States Data from Database</button>
            <div class='statesOrErrorDiv'></div>
        </div>
        
        <div id='getStatesFromRandomnessServiceDiv'>
            <button class='getStatesBtn'>Get States Data from Randomness Service</button>
            <div class='statesOrErrorDiv'></div>
        </div>
        
        <div>
            <button id='getStatesHtmlBtn'>Get States Data Table Rows HTML</button>
            <div id='statesHtmlOrErrorDiv'></div>
        </div>
        
        
        <div id='deleteCapitalsOfStatesQuizScoresDiv'>
            <button class='deleteScoresBtn'>Delete Capitals of States Quiz Scores</button>
            <p class='deleteStatusP'></p>
        </div>
        
        <div id='deleteStatesOfCapitalsQuizScoresDiv'>
            <button class='deleteScoresBtn'>Delete States of Capitals Quiz Scores</button>
            <p class='deleteStatusP'></p>
        </div>
    </div>
</body>
