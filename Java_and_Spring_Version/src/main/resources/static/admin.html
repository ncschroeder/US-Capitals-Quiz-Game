<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <title>Admin Dashboard</title>
    <link rel="icon" href="us-favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="admin.css" />
    <script src="admin.js" defer></script>
</head>
<body>
    <div id="top-left-content-div">
        <form action="/logout" method="post">
            <input type="submit" value="Log out" />
        </form>
        <a href="/" class="small-text">Home</a>
    </div>
    
    <h1>Admin Dashboard</h1>
    
    <div id="interaction-content-div" class="small-text">
        <div id="update-states-div">
            <h2>Update States Data</h2>
            <input type="file" id="states-file-input" class="small-text" accept="text/plain" />
            <button id="states-submit-btn">Submit</button>
            <div id="states-submit-status-div"></div>
        </div>
        
        
        <div id="get-states-from-database-div">
            <button class="get-states-btn">Get States Data from Database</button>
            <div class="states-or-error-div"></div>
        </div>
        
        <div id="get-states-from-randomness-service-div">
            <button class="get-states-btn">Get States Data from Randomness Service</button>
            <div class="states-or-error-div"></div>
        </div>
        
        <div>
            <button id="get-states-html-btn">Get States Data Table Rows HTML</button>
            <div id="states-html-or-error-div"></div>
        </div>
        
        
        <div id="delete-capitals-of-states-quiz-scores-div">
            <button class="delete-scores-btn">Delete Capitals of States Quiz Scores</button>
            <div class="delete-status-div"></div>
        </div>
        
        <div id="delete-states-of-capitals-quiz-scores-div">
            <button class="delete-scores-btn">Delete States of Capitals Quiz Scores</button>
            <div class="delete-status-div"></div>
        </div>
    </div>
</body>
